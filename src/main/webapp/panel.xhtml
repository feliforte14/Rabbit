<!DOCTYPE html>
<!--
    VISTA (Facelet) - Capa de Presentacion.
    Panel principal: primera pantalla tras un login exitoso (ver
    LoginBean.login()). Comercios y Depósitos son dos áreas independientes
    de la app — este panel es el único lugar que las enlaza juntas.

    Requiere sesión iniciada: si no hay caller autenticado, el
    f:viewAction manda a login.xhtml antes de renderizar nada (ver
    SesionBean.exigirSesion).
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewAction action="#{sesionBean.exigirSesion}" />
</f:metadata>
<h:head>
    <title>Rabbit · Panel principal</title>
    <h:outputStylesheet library="rabbit" name="estilos.css" />
</h:head>
<h:body>
    <div class="container">
        <h1>Rabbit</h1>

        <h:form>
            <h:commandButton value="Cerrar sesión" styleClass="btn btn-secondary" action="#{loginBean.logout}" />
        </h:form>

        <h2>Áreas</h2>
        <ul>
            <li><h:link outcome="comercios" value="Comercios" /></li>
            <li><h:link outcome="depositos" value="Depósitos" /></li>
            <li><h:link outcome="pedidos" value="Pedidos" /></li>
        </ul>
    </div>
</h:body>
</html>
