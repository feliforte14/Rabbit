<!DOCTYPE html>
<!--
    VISTA (Facelet) - Capa de Presentacion.
    Muestra el listado de depositos y el formulario para registrar uno
    nuevo. Se bindea al Managed Bean depositoBean (DepositoBean.java).

    Los depositos son infraestructura PROPIA de Rabbit (ver Sección 1.2
    del documento técnico): a propósito no se les asigna comercio ni
    PuntoPicking — son independientes de a quién le pertenece la
    mercadería que consolidan.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Rabbit · Depósitos</title>
    <h:outputStylesheet library="rabbit" name="estilos.css" />
</h:head>
<h:body>
    <div class="container">
        <p><h:link outcome="panel" value="&#8592; Panel principal" styleClass="enlace-volver" /></p>

        <h1>Depósitos</h1>

        <h:messages globalOnly="true" showDetail="false" showSummary="true"
                    layout="list" styleClass="mensajes"
                    errorClass="mensaje-error" infoClass="mensaje-info" />

        <h:form id="formListado">
            <h:dataTable value="#{depositoBean.depositos}" var="d"
                         styleClass="tabla" rowClasses="fila-impar,fila-par">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{d.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Nombre</f:facet>
                    #{d.nombre}
                </h:column>
                <h:column>
                    <f:facet name="header">Dirección</f:facet>
                    #{d.direccion}
                </h:column>
                <h:column>
                    <f:facet name="header">Stock</f:facet>
                    <h:link outcome="reservas" value="Reservar stock" /> &#183; <h:link outcome="items" value="Ver stock">
                        <f:param name="idDeposito" value="#{d.id}" />
                    </h:link>
                </h:column>
            </h:dataTable>
        </h:form>

        <h2>Registrar nuevo depósito</h2>
        <h:form id="formAlta" styleClass="formulario">
            <div class="campo">
                <h:outputLabel for="nombre" value="Nombre" />
                <h:inputText id="nombre" value="#{depositoBean.nuevoDeposito.nombre}" required="true" label="Nombre" />
            </div>

            <div class="campo">
                <h:outputLabel for="direccion" value="Dirección" />
                <h:inputText id="direccion" value="#{depositoBean.nuevoDeposito.direccion}" required="true" label="Dirección" />
            </div>

            <div class="form-acciones">
                <h:commandButton value="Registrar" styleClass="btn btn-primary" action="#{depositoBean.registrar}" />
            </div>
        </h:form>
    </div>
</h:body>
</html>
