<!DOCTYPE html>
<!--
    VISTA (Facelet) - Capa de Presentacion.
    Administra las sucursales de un comercio puntual, recibido por
    query param (?idComercio=X). Se bindea a sucursalBean (SucursalBean.java).
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="idComercio" value="#{sucursalBean.idComercio}" required="true" />
    <f:viewAction action="#{sucursalBean.cargar}" />
</f:metadata>
<h:head>
    <title>Rabbit · Sucursales</title>
    <style>
        .mensaje-error { color: red; }
        .mensaje-info { color: green; }
    </style>
</h:head>
<h:body>
    <p><h:link outcome="comercios" value="&#8592; Volver a comercios" /></p>

    <h1>Sucursales de #{sucursalBean.comercio.nombre}</h1>

    <h:messages globalOnly="false" showDetail="false" showSummary="true" errorClass="mensaje-error" infoClass="mensaje-info" />

    <h:form>
        <h:dataTable value="#{sucursalBean.sucursales}" var="s" border="1"
                     cellpadding="6" cellspacing="0">
            <h:column>
                <f:facet name="header">ID</f:facet>
                #{s.id}
            </h:column>
            <h:column>
                <f:facet name="header">Nombre</f:facet>
                #{s.nombre}
            </h:column>
            <h:column>
                <f:facet name="header">Dirección</f:facet>
                #{s.direccion}
            </h:column>
            <h:column>
                <f:facet name="header">Activa</f:facet>
                #{s.activa ? 'Sí' : 'No'}
            </h:column>
            <h:column>
                <f:facet name="header">Acciones</f:facet>
                <h:commandButton value="Dar de baja" action="#{sucursalBean.darDeBaja(s.id)}"
                                 rendered="#{s.activa}" />
                <h:commandButton value="Reactivar" action="#{sucursalBean.reactivar(s.id)}"
                                 rendered="#{not s.activa}" />
            </h:column>
        </h:dataTable>
    </h:form>

    <h2>Agregar sucursal</h2>
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="Nombre:" for="nombre" />
            <h:inputText id="nombre" value="#{sucursalBean.nuevaSucursal.nombre}" required="true" />

            <h:outputLabel value="Dirección:" for="direccion" />
            <h:inputText id="direccion" value="#{sucursalBean.nuevaSucursal.direccion}" required="true" />
        </h:panelGrid>

        <h:commandButton value="Agregar sucursal" action="#{sucursalBean.registrar}" />
    </h:form>
</h:body>
</html>
