# Handlers de Undertow (WildFly) para esta aplicación.
#
# SameSite=Lax en la cookie de sesión: no viaja en un POST que arranca en
# otro sitio (CSRF), pero sí al abrir un link a Rabbit desde un mail; Strict
# obligaría a loguearse de nuevo al seguir ese link. Va acá y no en el
# cookie-config del web.xml porque WildFly 41 ignora ahí el atributo SameSite.
samesite-cookie(mode=Lax, cookie-pattern=JSESSIONID)
