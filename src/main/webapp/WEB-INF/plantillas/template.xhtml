<!DOCTYPE html>
<!--
    TEMPLATE (Facelets) - Capa de Presentacion.

    Layout compartido por todas las pantallas que requieren sesión
    iniciada: sidebar de navegación (tomado del prototipo de Figma del
    equipo) + área de contenido. Cada página lo usa con
    <ui:composition template="/WEB-INF/plantillas/template.xhtml"> y define su contenido en
    <ui:define name="contenido">.

    La sesión NO se exige acá: cada página conserva su propio
    <f:metadata> (algunas ya lo necesitan para <f:viewParam>), y ahí
    agrega su guardián (\#{sesionBean.exigirPersonal},
    \#{sesionBean.exigirComercio}, ...) — mantiene el patrón explícito que
    ya usa el resto del proyecto en vez de esconder la regla en el
    template.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
<h:head>
    <meta charset="UTF-8" />
    <title><ui:insert name="titulo">Rabbit</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <h:outputStylesheet library="rabbit" name="estilos.css" />
    <!-- Antes de pintar: aplica el tema elegido (ver tema.js). -->
    <h:outputScript library="rabbit" name="tema.js" />
    <!-- En el celular, el menú se despliega con un botón (ver menu.js). -->
    <h:outputScript library="rabbit" name="menu.js" />
    <!-- En el celular, las tablas se ven como tarjetas (ver tablas.js). -->
    <h:outputScript library="rabbit" name="tablas.js" />
    <ui:insert name="cabecera" />
</h:head>
<h:body>
    <div class="app-layout">
        <aside class="sidebar" id="menu-principal">
            <div class="sidebar-logo">
                <div>
                    <p class="marca">rabbit</p>
                    <p class="slogan">Plataforma de entregas urbanas</p>
                </div>
                <!-- Solo en celular y tablet (ver menu.js) -->
                <button type="button" class="menu-boton" aria-expanded="false" aria-controls="menu-principal">
                    <span class="menu-icono" aria-hidden="true"></span>
                    Menú
                </button>
            </div>

            <!--
                Un menú por tipo de usuario (ver SesionBean): el personal de
                Rabbit opera toda la red; un comercio ve solo lo suyo; un
                repartidor, sus entregas. Ocultar un enlace no es seguridad:
                cada página tiene su guardián y cada EJB su @RolesAllowed.
            -->
            <h:panelGroup layout="block" styleClass="sidebar-nav" rendered="#{sesionBean.personal}">
                <p class="sidebar-seccion">Operación</p>
                <h:link outcome="/personal/pedidos" value="Pedidos"
                        styleClass="#{view.viewId == '/personal/pedidos.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/personal/ruteo" value="Ruteo por zona"
                        styleClass="#{view.viewId == '/personal/ruteo.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/personal/entregas" value="Entregas en curso"
                        styleClass="#{view.viewId == '/personal/entregas.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/personal/mapa" value="Mapa de repartidores"
                        styleClass="#{view.viewId == '/personal/mapa.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/personal/repartidores" value="Repartidores"
                        styleClass="#{view.viewId == '/personal/repartidores.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/personal/transportistas" value="Transportistas"
                        styleClass="#{view.viewId == '/personal/transportistas.xhtml' ? 'activo' : ''}" />
                <p class="sidebar-seccion">Red</p>
                <h:link outcome="/personal/comercios" value="Comercios"
                        styleClass="#{view.viewId == '/personal/comercios.xhtml' or view.viewId == '/comercio/puntos-picking.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/personal/depositos" value="Depósitos y stock"
                        styleClass="#{view.viewId == '/personal/depositos.xhtml' or view.viewId == '/personal/items.xhtml' or view.viewId == '/personal/reservas.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/personal/historial" value="Historial de reservas"
                        styleClass="#{view.viewId == '/personal/historial.xhtml' ? 'activo' : ''}" />
                <p class="sidebar-seccion">Cobranza</p>
                <h:link outcome="/personal/liquidaciones" value="Liquidaciones mensuales"
                        styleClass="#{view.viewId == '/personal/liquidaciones.xhtml' ? 'activo' : ''}" />
                <h:panelGroup rendered="#{sesionBean.admin}">
                    <p class="sidebar-seccion">Administración</p>
                    <h:link outcome="/personal/usuarios" value="Usuarios"
                            styleClass="#{view.viewId == '/personal/usuarios.xhtml' ? 'activo' : ''}" />
                </h:panelGroup>
            </h:panelGroup>

            <h:panelGroup layout="block" styleClass="sidebar-nav" rendered="#{sesionBean.comercio}">
                <h:link outcome="/comercio/mis-pedidos" value="Mis pedidos"
                        styleClass="#{view.viewId == '/comercio/mis-pedidos.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/comercio/mi-stock" value="Mi stock"
                        styleClass="#{view.viewId == '/comercio/mi-stock.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/comercio/puntos-picking" value="Mis puntos de picking"
                        styleClass="#{view.viewId == '/comercio/puntos-picking.xhtml' ? 'activo' : ''}" />
                <h:link outcome="/comercio/mis-liquidaciones" value="Mis liquidaciones"
                        styleClass="#{view.viewId == '/comercio/mis-liquidaciones.xhtml' ? 'activo' : ''}" />
            </h:panelGroup>

            <h:panelGroup layout="block" styleClass="sidebar-nav" rendered="#{sesionBean.repartidor}">
                <h:link outcome="/repartidor/mis-entregas" value="Mis entregas"
                        styleClass="#{view.viewId == '/repartidor/mis-entregas.xhtml' ? 'activo' : ''}" />
            </h:panelGroup>

            <div class="sidebar-foot">
                <p class="sidebar-usuario">
                    <b>#{sesionBean.usuarioActual}</b> · #{sesionBean.rolActual}#{empty sesionBean.representado ? '' : ' · '.concat(sesionBean.representado)}
                </p>
                <div class="sidebar-acciones">
                    <!-- Tema visual: se cambia en el momento (ver tema.js). -->
                    <div class="tema-selector" role="group" aria-label="Tema visual">
                        <button type="button" class="icono-boton" data-tema="claro" aria-pressed="false" aria-label="Tema claro" title="Tema claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
                        <button type="button" class="icono-boton" data-tema="normal" aria-pressed="false" aria-label="Tema normal" title="Tema normal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
                        <button type="button" class="icono-boton" data-tema="oscuro" aria-pressed="false" aria-label="Tema oscuro" title="Tema oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
                    </div>
                    <h:form>
                        <h:commandLink styleClass="icono-boton" action="#{loginBean.logout}" title="Cerrar sesión">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
                            <span class="solo-lector">Cerrar sesión</span>
                        </h:commandLink>
                    </h:form>
                </div>
            </div>
        </aside>

        <main class="app-contenido">
            <ui:insert name="contenido" />
        </main>
    </div>
</h:body>
</html>
