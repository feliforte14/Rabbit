<!DOCTYPE html>
<!--
    VISTA (Facelet) - Capa de Presentacion.
    Muestra el listado de comercios registrados (con botones para dar de
    baja o eliminar cada uno) y, mas abajo, el formulario para registrar
    uno nuevo. Se bindea al Managed Bean comercioBean (ComercioBean.java)
    via Expression Language: por ejemplo #{comercioBean.comercios}.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Rabbit · Comercios</title>
    <style>
        .mensaje-error { color: red; }
        .mensaje-info { color: green; }
    </style>
</h:head>
<h:body>
    <p><h:link outcome="depositos" value="Ver depósitos &#8594;" /></p>

    <h1>Comercios registrados</h1>

    <h:messages globalOnly="false" showDetail="false" showSummary="true" errorClass="mensaje-error" infoClass="mensaje-info" />

    <h:form>
        <h:dataTable value="#{comercioBean.comercios}" var="c" border="1"
                     cellpadding="6" cellspacing="0">
            <h:column>
                <f:facet name="header">ID</f:facet>
                #{c.id}
            </h:column>
            <h:column>
                <f:facet name="header">Nombre</f:facet>
                #{c.nombre}
            </h:column>
            <h:column>
                <f:facet name="header">Razón Social</f:facet>
                #{c.razonSocial}
            </h:column>
            <h:column>
                <f:facet name="header">CUIT</f:facet>
                #{c.cuit}
            </h:column>
            <h:column>
                <f:facet name="header">Activo</f:facet>
                #{c.activo ? 'Sí' : 'No'}
            </h:column>
            <h:column>
                <f:facet name="header">Sucursales</f:facet>
                <h:link outcome="sucursales" value="Ver sucursales">
                    <f:param name="idComercio" value="#{c.id}" />
                </h:link>
            </h:column>
            <h:column>
                <f:facet name="header">Acciones</f:facet>
                <h:commandButton value="Dar de baja" action="#{comercioBean.darDeBaja(c.id)}"
                                 rendered="#{c.activo}" />
                <h:commandButton value="Reactivar" action="#{comercioBean.reactivar(c.id)}"
                                 rendered="#{not c.activo}" />
                <h:commandButton value="Eliminar" action="#{comercioBean.eliminar(c.id)}"
                                  rendered="#{not c.activo}"
                                  onclick="return confirm('¿Eliminar definitivamente este comercio y todas sus sucursales? Esta acción no se puede deshacer.');" />
            </h:column>
        </h:dataTable>
    </h:form>

    <h2>Registrar nuevo comercio</h2>
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="Nombre:" for="nombre" />
            <h:inputText id="nombre" value="#{comercioBean.nuevoComercio.nombre}" required="true" />

            <h:outputLabel value="Razón Social:" for="razonSocial" />
            <h:inputText id="razonSocial" value="#{comercioBean.nuevoComercio.razonSocial}" required="true" />

            <h:outputLabel value="CUIT:" for="cuit" />
            <h:inputText id="cuit" value="#{comercioBean.nuevoComercio.cuit}" required="true" />

            <h:outputLabel value="Email:" for="email" />
            <h:inputText id="email" value="#{comercioBean.nuevoComercio.email}" />

            <h:outputLabel value="Teléfono:" for="telefono" />
            <h:inputText id="telefono" value="#{comercioBean.nuevoComercio.telefono}" />
        </h:panelGrid>

        <h:commandButton value="Registrar" action="#{comercioBean.registrar}" />
    </h:form>
</h:body>
</html>
