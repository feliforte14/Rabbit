<!DOCTYPE html>
<!--
    VISTA (Facelet) - Capa de Presentacion.
    Formulario de login — primera pantalla de la app (ver welcome-file en
    web.xml). Se bindea a loginBean (LoginBean.java), que dispara
    HttpServletRequest.login() contra el ApplicationRealm de WildFly. Es la
    misma para todos los tipos de usuario (personal de Rabbit, comercio,
    repartidor): el tipo no se elige aca, lo trae la cuenta, y LoginBean
    manda a cada uno a su pantalla.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <meta charset="UTF-8" />
    <title>Rabbit · Iniciar sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <h:outputStylesheet library="rabbit" name="estilos.css" />
    <!-- Antes de pintar: aplica el tema elegido (ver tema.js). -->
    <h:outputScript library="rabbit" name="tema.js" />
</h:head>
<h:body styleClass="pagina-sola">
    <div class="container">
        <div class="login-marca">
            <h:graphicImage library="rabbit" name="logo.png" alt="rabbit" styleClass="marca-logo" />
            <p class="slogan">Entregas urbanas para comercios</p>
        </div>

        <h1>Iniciar sesión</h1>

        <h:messages globalOnly="false" showDetail="false" showSummary="true"
                    layout="list" styleClass="mensajes"
                    errorClass="mensaje-error" infoClass="mensaje-info" />

        <h:panelGroup rendered="#{param.error}">
            <p class="mensaje-error">Usuario o contraseña incorrectos.</p>
        </h:panelGroup>

        <h:form id="formLogin" styleClass="formulario">
            <div class="campo">
                <h:outputLabel for="username" value="Usuario" />
                <h:inputText id="username" value="#{loginBean.username}" required="true" label="Usuario"
                             requiredMessage="Ingresá tu usuario" />
            </div>

            <div class="campo">
                <h:outputLabel for="password" value="Contraseña" />
                <h:inputSecret id="password" value="#{loginBean.password}" required="true" label="Contraseña"
                               requiredMessage="Ingresá tu contraseña" />
            </div>

            <div class="form-acciones login-acciones">
                <h:commandButton value="Ingresar" styleClass="btn btn-primary" action="#{loginBean.login}" />
            </div>
        </h:form>

        <!-- Sin alta abierta: el pedido llega por mail y un administrador
             crea la cuenta (ver LoginBean.getContactoMailto). -->
        <p class="ayuda">¿Sos un comercio o repartidor y no tenés cuenta? Escribinos a
            <a href="#{loginBean.contactoMailto}">#{loginBean.contactoMail}</a> y te la creamos.</p>

        <!-- Para el cliente final, que no tiene cuenta: el seguimiento publico. -->
        <p class="enlace-seguimiento">
            ¿Compraste en una tienda y querés saber dónde está tu pedido?&#160;<h:link outcome="/seguimiento" value="Seguí tu pedido" />
        </p>
        <!-- Tema visual: se cambia en el momento (ver tema.js). -->
        <div class="tema-selector tema-pie" role="group" aria-label="Tema visual">
            <button type="button" class="icono-boton" data-tema="claro" aria-pressed="false" aria-label="Tema claro" title="Tema claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
            <button type="button" class="icono-boton" data-tema="normal" aria-pressed="false" aria-label="Tema normal" title="Tema normal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/></svg></button>
            <button type="button" class="icono-boton" data-tema="oscuro" aria-pressed="false" aria-label="Tema oscuro" title="Tema oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        </div>
    </div>
</h:body>
</html>
