<!DOCTYPE html>
<!--
    VISTA (Facelet) - Capa de Presentacion.
    Administra los puntos de picking de un comercio puntual, recibido por
    query param (?idComercio=X). Se bindea a puntoPickingBean
    (PuntoPickingBean.java). Renombrada desde sucursales.xhtml (ver
    Sección 1.2 del documento técnico).

    El estilo visual vive aparte, en resources/rabbit/1_0/estilos.css
    (recurso JSF versionado), linkeado con <h:outputStylesheet>. Es solo
    CSS: no cambia ningun binding ni ninguna accion de los Managed Beans.
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:metadata>
    <f:viewParam name="idComercio" value="#{puntoPickingBean.idComercio}" required="true" />
    <f:viewAction action="#{puntoPickingBean.cargar}" />
</f:metadata>
<h:head>
    <title>Rabbit · Puntos de picking</title>
    <h:outputStylesheet library="rabbit" name="estilos.css" />
</h:head>
<h:body>
    <div class="container">
        <p><h:link outcome="comercios" value="&#8592; Volver a comercios" styleClass="enlace-volver" /></p>

        <h1>Puntos de picking de #{puntoPickingBean.comercio.nombre}</h1>

        <!-- Solo mensajes de negocio y confirmaciones; los errores de campo
             van inline en el formulario de abajo (ver <h:message for="...">). -->
        <h:messages globalOnly="true" showDetail="false" showSummary="true"
                    layout="list" styleClass="mensajes"
                    errorClass="mensaje-error" infoClass="mensaje-info" />

        <h:form id="formListado">
            <h:dataTable value="#{puntoPickingBean.puntosPicking}" var="p"
                         styleClass="tabla" rowClasses="fila-impar,fila-par">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{p.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Nombre</f:facet>
                    #{p.nombre}
                </h:column>
                <h:column>
                    <f:facet name="header">Dirección</f:facet>
                    #{p.direccion}
                </h:column>
                <h:column>
                    <f:facet name="header">Activo</f:facet>
                    #{p.activa ? 'Sí' : 'No'}
                </h:column>
                <h:column styleClass="acciones">
                    <f:facet name="header">Acciones</f:facet>
                    <h:commandButton value="Dar de baja" styleClass="btn btn-secondary"
                                     action="#{puntoPickingBean.darDeBaja(p.id)}"
                                     rendered="#{p.activa}" />
                    <h:commandButton value="Reactivar" styleClass="btn btn-secondary"
                                     action="#{puntoPickingBean.reactivar(p.id)}"
                                     rendered="#{not p.activa}" />
                </h:column>
            </h:dataTable>
        </h:form>

        <h2>Agregar punto de picking</h2>
        <h:form id="formAlta" styleClass="formulario">
            <div class="campo">
                <h:outputLabel for="nombre" value="Nombre" />
                <h:inputText id="nombre" value="#{puntoPickingBean.nuevoPuntoPicking.nombre}"
                             required="true" label="Nombre"
                             requiredMessage="Ingresá el nombre del punto de picking" />
                <h:message for="nombre" styleClass="error-campo" />
            </div>

            <div class="campo">
                <h:outputLabel for="direccion" value="Dirección" />
                <h:inputText id="direccion" value="#{puntoPickingBean.nuevoPuntoPicking.direccion}"
                             required="true" label="Dirección"
                             requiredMessage="Ingresá la dirección del punto de picking" />
                <h:message for="direccion" styleClass="error-campo" />
            </div>

            <div class="form-acciones">
                <h:commandButton value="Agregar punto de picking" styleClass="btn btn-primary" action="#{puntoPickingBean.registrar}" />
            </div>
        </h:form>
    </div>
</h:body>
</html>
