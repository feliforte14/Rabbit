# =====================================================================
# Rabbit completo en local: base PostgreSQL + WildFly 41 con la app.
#
#   cp .env.example .env      # y completá las tres contraseñas
#   docker compose up --build
#
# Después: https://localhost:8443/Rabbit (certificado autofirmado).
# La base es local, no Supabase. Los datos quedan en el volumen
# "datos"; "docker compose down -v" la borra y arranca de cero.
# =====================================================================

services:
  # Revisa el .env antes de levantar nada (docker/config/validar.sh): con un
  # <marcador> sin reemplazar o una contraseña corta, el arranque corta acá.
  config:
    image: postgres:16-alpine
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      ADMIN_USER: ${ADMIN_USER:?Falta ADMIN_USER en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Falta DEMO_PASSWORD en .env}
    volumes:
      - ./docker/config:/config:ro
    entrypoint: ["sh", "/config/validar.sh"]
    restart: "no"

  db:
    image: postgres:16-alpine
    depends_on:
      config:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${DB_NAME:-rabbit}
      POSTGRES_USER: ${DB_USER:-rabbit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - datos:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  wildfly:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-rabbit}
      DB_USER: ${DB_USER:-rabbit}
      DB_PASSWORD: ${DB_PASSWORD}
      RABBIT_HORA_CORTE: ${RABBIT_HORA_CORTE:-ninguno}
    ports:
      - "8080:8080"
      - "8443:8443"
      - "127.0.0.1:9990:9990"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost:8443/Rabbit/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  semilla:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
      wildfly:
        condition: service_started
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-rabbit}
      DB_USER: ${DB_USER:-rabbit}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER:?Falta ADMIN_USER en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Falta DEMO_PASSWORD en .env}
    volumes:
      - ./docker/semilla:/semilla:ro
    entrypoint: ["sh", "/semilla/cargar.sh"]
    restart: "no"

volumes:
  datos:
