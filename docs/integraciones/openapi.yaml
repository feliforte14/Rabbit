openapi: 3.1.0
info:
  title: Rabbit API
  version: 1.0.0
  summary: Pedidos del ERP de los comercios y seguimiento público de pedidos.
  description: |
    API REST de Rabbit (logística de última milla).

    - **ERP del comercio** (`/v1/pedidos-externos`): registra pedidos, consulta
      cómo terminaron y los cancela. HTTP Basic con un usuario de tipo ERP,
      creado por un administrador de Rabbit y asociado a UN comercio: cada
      cuenta carga y ve solo los pedidos de su comercio.
    - **Seguimiento público** (`/v1/seguimiento`): estado de un pedido por su
      código de seguimiento, sin autenticación.

    La conversión de un pedido externo en pedido real es asincrónica (cola
    JMS): el `POST` responde enseguida con `resultado: Pendiente` y el ERP
    consulta después (o sigue los `_links`).

    Todos los errores usan Problem Details (RFC 9457, `application/problem+json`).
servers:
  - url: https://localhost:8443/Rabbit/api
    description: WildFly local (HTTPS obligatorio; en local, certificado autofirmado)

tags:
  - name: Pedidos externos
    description: Integración con el ERP de cada comercio (rol ERP).
  - name: Seguimiento
    description: Consulta pública del estado de un pedido.

paths:
  /v1/pedidos-externos:
    post:
      tags: [Pedidos externos]
      operationId: registrarPedidoExterno
      summary: Registrar un pedido del ERP
      description: |
        Registra el pedido y lo encola para convertirlo en pedido real.
        Idempotente con el header `Idempotency-Key`: si el ERP reintenta con
        la misma clave y el mismo pedido (por ejemplo, tras un timeout),
        recibe el pedido externo ya creado, sin duplicarlo.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoExternoRequest'
            examples:
              stockConsignado:
                summary: Con stock consignado en un depósito de Rabbit
                value:
                  origen: STOCK_CONSIGNADO
                  lineas:
                    - { idItem: 3, cantidad: 2 }
                  importe: 2500.00
                  medioPago: PREPAGO
                  direccionEntrega: Av. Corrientes 1234, CABA
                  codigoPostalEntrega: "1043"
                  nombreDestinatario: Ana Pérez
                  telefonoDestinatario: "+54 11 4567-8901"
                  emailDestinatario: ana@correo.com
              retiroEnDeposito:
                summary: Lo retira quien compró en el depósito (sin dirección ni repartidor)
                value:
                  origen: STOCK_CONSIGNADO
                  tipoEntrega: RETIRO_EN_DEPOSITO
                  lineas:
                    - { idItem: 3, cantidad: 1 }
                  importe: 2500.00
                  medioPago: PREPAGO
                  emailDestinatario: ana@correo.com
              puntoPicking:
                summary: A retirar de un punto de picking del comercio
                value:
                  origen: PUNTO_PICKING
                  idPuntoPicking: 1
                  lineas:
                    - { producto: Caja de zapatillas, cantidad: 1 }
                  importe: 89000.00
                  medioPago: CONTRA_ENTREGA
                  direccionEntrega: Lima 775, CABA
                  emailDestinatario: cliente@correo.com
                  pesoKg: 1.2
      responses:
        '201':
          description: Pedido registrado (o ya registrado con esa clave). Queda Pendiente hasta que se sincroniza.
          headers:
            Location:
              description: URI del pedido externo.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoExterno'
              example:
                idPedidoExterno: 42
                resultado: Pendiente
                fechaPrometida: "2026-10-16"
                _links:
                  self: { href: "https://localhost:8443/Rabbit/api/v1/pedidos-externos/42" }
                  cancelar: { href: "https://localhost:8443/Rabbit/api/v1/pedidos-externos/42/cancelacion", method: POST }
        '400':
          description: Falta el cuerpo o el header `Idempotency-Key`, el JSON es inválido o hay campos con formato inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: /problemas/datos-con-formato-invalido
                title: Hay campos con formato inválido
                status: 400
                detail: Revisá los campos indicados en "errores"
                errores:
                  - { campo: importe, mensaje: El importe del pedido debe ser mayor a cero }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '422':
          description: El pedido no cumple una regla de negocio, o la clave de idempotencia ya se usó con otro pedido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                reglaDeNegocio:
                  value:
                    type: /problemas/datos-invalidos
                    title: El pedido no cumple las reglas de Rabbit
                    status: 422
                    detail: Debe indicar el punto de picking del pedido
                claveReutilizada:
                  value:
                    type: /problemas/clave-idempotencia-reutilizada
                    title: Clave de idempotencia reutilizada
                    status: 422
                    detail: La clave de idempotencia "7f3c9e1a-..." ya se usó con otro pedido
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /v1/pedidos-externos/{id}:
    get:
      tags: [Pedidos externos]
      operationId: consultarPedidoExterno
      summary: Cómo terminó un pedido enviado
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPedidoExterno'
      responses:
        '200':
          description: Estado del pedido externo y, si ya se generó, del pedido real.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoExterno'
              example:
                idPedidoExterno: 42
                resultado: Sincronizado
                idPedido: 118
                estadoPedido: PENDIENTE
                codigoSeguimiento: RB-7KQ2M9XHTA
                fechaPrometida: "2026-10-16"
                _links:
                  self: { href: "https://localhost:8443/Rabbit/api/v1/pedidos-externos/42" }
                  cancelar: { href: "https://localhost:8443/Rabbit/api/v1/pedidos-externos/42/cancelacion", method: POST }
                  seguimiento: { href: "https://localhost:8443/Rabbit/api/v1/seguimiento/RB-7KQ2M9XHTA" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/PedidoExternoInexistente' }
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /v1/pedidos-externos/{id}/cancelacion:
    post:
      tags: [Pedidos externos]
      operationId: cancelarPedidoExterno
      summary: Cancelar un pedido enviado
      description: |
        Si todavía no se convirtió en pedido, no se convierte (`resultado: Cancelado`).
        Si ya es un pedido `PENDIENTE`, se cancela y se devuelve el stock
        (`estadoPedido: CANCELADO`). Desde `CONFIRMADO` en adelante ya tiene
        cobro y repartidor: responde 409 y lo cancela el personal de Rabbit.
        Lo mismo con un `PENDIENTE` que el repartidor devolvió al depósito:
        ya salió a reparto (409).
        Idempotente: cancelar algo ya cancelado devuelve 200 con el mismo estado.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPedidoExterno'
      responses:
        '200':
          description: El pedido quedó cancelado (o ya lo estaba).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoExterno'
              example:
                idPedidoExterno: 42
                resultado: Cancelado
                motivo: Cancelado por el comercio
                _links:
                  self: { href: "https://localhost:8443/Rabbit/api/v1/pedidos-externos/42" }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/PedidoExternoInexistente' }
        '409':
          description: |
            El pedido ya avanzó y el comercio no puede cancelarlo por la API
            (`cancelacion-no-permitida`), o la devolución de stock chocó con
            otra sesión tocando el mismo ítem al mismo tiempo
            (`stock-en-conflicto`: pasajero, reintentar).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                cancelacionNoPermitida:
                  summary: El pedido ya avanzó
                  value:
                    type: /problemas/cancelacion-no-permitida
                    title: El pedido ya no se puede cancelar
                    status: 409
                    detail: "El pedido 118 está EN_CAMINO: el comercio ya no puede cancelarlo por la API. Ya salió a reparto: no se puede cancelar."
                stockEnConflicto:
                  summary: Choque pasajero de stock, reintentar
                  value:
                    type: /problemas/stock-en-conflicto
                    title: El stock cambió al mismo tiempo, reintentá
                    status: 409
                    detail: "No se pudo devolver el stock del pedido: Otro usuario acaba de modificar el stock de \"Afeitadoras eléctricas\" al mismo tiempo. Volvé a intentarlo para ver el stock actualizado."
        '500': { $ref: '#/components/responses/ErrorInterno' }

  /v1/seguimiento/{codigo}:
    get:
      tags: [Seguimiento]
      operationId: consultarSeguimiento
      summary: Estado de un pedido por su código de seguimiento
      description: Público, sin autenticación. Solo expone el estado, la fecha prometida y, en camino, la parada y la franja; nunca datos de quien recibe.
      security: []
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código de seguimiento que el ERP recibe en `codigoSeguimiento`.
          schema: { type: string, pattern: '^RB-[2-9A-HJKMNP-Z]{10}$', example: RB-7KQ2M9XHTA }
      responses:
        '200':
          description: Estado actual del pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seguimiento'
        '404':
          description: Ningún pedido tiene ese código.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Usuario de tipo ERP, asociado a un comercio.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Identificador único del pedido en el ERP (por ejemplo un UUID). El mismo en cada reintento.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$', example: 7f3c9e1a-5b2d-4c8e-9f10-2a6b3c4d5e6f }
    IdPedidoExterno:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    NoAutenticado:
      description: Faltan las credenciales o son incorrectas (desafío HTTP Basic del servidor). Lo responde WildFly en HTML, no en Problem Details.
    SinPermiso:
      description: |
        El usuario no es de tipo ERP, o es un ERP sin comercio asociado.
        Si no es ERP, lo rechaza el propio WildFly (seguridad declarativa) con
        su página de error en HTML, antes de llegar al código de Rabbit; el
        ERP sin comercio sí lo responde Rabbit en Problem Details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: /problemas/cuenta-erp-sin-comercio
            title: Cuenta ERP sin comercio
            status: 403
            detail: "Tu usuario ERP no está asociado a ningún comercio: pedile a Rabbit que lo dé de alta desde la app"
    PedidoExternoInexistente:
      description: No existe, o es de otro comercio (para el ERP es lo mismo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: /problemas/pedido-inexistente
            title: Pedido externo inexistente
            status: 404
            detail: No hay ningún pedido externo 42 de tu comercio
    ErrorInterno:
      description: Falla de Rabbit. El detalle queda en el log del servidor, nunca en la respuesta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'

  schemas:
    PedidoExternoRequest:
      type: object
      required: [lineas, importe, medioPago, emailDestinatario]
      properties:
        origen:
          type: string
          enum: [STOCK_CONSIGNADO, PUNTO_PICKING]
          default: STOCK_CONSIGNADO
        idPuntoPicking:
          type: integer
          format: int64
          description: Obligatorio con origen PUNTO_PICKING. Debe ser del comercio del ERP.
        lineas:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/LineaPedido'
        importe:
          type: number
          minimum: 0.01
          description: Total de la venta, con hasta 2 decimales.
        medioPago:
          type: string
          enum: [PREPAGO, CONTRA_ENTREGA]
        tipoEntrega:
          type: string
          enum: [DOMICILIO, RETIRO_EN_DEPOSITO]
          default: DOMICILIO
          description: >
            RETIRO_EN_DEPOSITO: quien compró retira el pedido en el depósito donde está el stock, mostrando
            el código de seguimiento. Solo con origen STOCK_CONSIGNADO y con todos los productos en el mismo
            depósito (si no, 422). No lleva repartidor, ni lista de espera, ni dirección.
        direccionEntrega:
          type: string
          maxLength: 200
          description: Obligatoria con tipoEntrega DOMICILIO (el valor por defecto). En un retiro en depósito se ignora.
        codigoPostalEntrega:
          type: string
          maxLength: 8
          description: 4 dígitos o CPA (C1414ABC). Si no viene, se busca en la dirección. Con otro formato ("12") responde 422 (regla de negocio, no de formato).
        pesoKg:
          type: number
          minimum: 0.001
          maximum: 5000
          description: Solo con PUNTO_PICKING, opcional. Kilos totales del pedido, con hasta 3 decimales; sin él, el límite del repartidor solo cuenta bultos. Con STOCK_CONSIGNADO no se informa (responde 422) porque Rabbit lo calcula con el peso de cada ítem.
        nombreDestinatario:
          type: string
          maxLength: 100
          description: Opcional. Quién recibe; lo ve el repartidor. Nunca sale en el seguimiento público (ADR-039).
        telefonoDestinatario:
          type: string
          maxLength: 30
          description: Opcional. Números, espacios, guiones, paréntesis y un + al principio; uno que no sirve responde 422.
        emailDestinatario:
          type: string
          format: email
          maxLength: 120
          description: |
            Obligatorio desde el 18/10/2026: Rabbit le avisa por mail a quien recibe cada cambio de estado, con el link al seguimiento (ADR-040). Si falta, responde 400 con el campo `emailDestinatario` en `errores`. Los pedidos dados de alta antes de ese día pueden no tenerlo.
    LineaPedido:
      type: object
      required: [cantidad]
      properties:
        idItem:
          type: integer
          format: int64
          description: Con STOCK_CONSIGNADO, el ítem consignado en Rabbit.
        producto:
          type: string
          maxLength: 200
          description: Con PUNTO_PICKING, qué se retira.
        cantidad:
          type: integer
          minimum: 1
    PedidoExterno:
      type: object
      required: [idPedidoExterno, resultado, _links]
      properties:
        idPedidoExterno: { type: integer, format: int64 }
        resultado:
          type: string
          enum: [Pendiente, Sincronizado, Descartado, Cancelado]
        idPedido:
          type: integer
          format: int64
          description: Pedido real generado (con resultado Sincronizado).
        estadoPedido:
          type: string
          enum: [PENDIENTE, CONFIRMADO, EN_CAMINO, ENTREGADO, CANCELADO, DEVUELTO_AL_COMERCIO]
          description: DEVUELTO_AL_COMERCIO es final: se agotaron las visitas o el cliente lo rechazó (ADR-041).
        fechaPrometida:
          type: string
          format: date
          description: |
            Día en que Rabbit se compromete a entregarlo (ADR-042): hoy si llegó
            antes de la hora de corte (07:00), mañana si no. Viene desde la
            respuesta del alta. No viene si el pedido no tiene código postal.
        intentosFallidos:
          type: integer
          description: Visitas que no terminaron en entrega (ADR-041). No viene si es 0.
        codigoSeguimiento:
          type: string
          description: Para el seguimiento público. Se lo puede pasar al cliente final.
        enListaDeEspera:
          type: boolean
          description: |
            Solo con `estadoPedido: PENDIENTE`. `true` si Rabbit lo quiso
            confirmar pero ningún repartidor tenía lugar (o ya había pasado la
            hora de corte de la hoja de ruta): se asigna solo en cuanto se pueda.
        motivo:
          type: string
          description: Por qué se descartó o canceló.
        _links:
          type: object
          description: Acciones posibles ahora (HATEOAS). `cancelar` aparece solo si se puede cancelar.
          properties:
            self: { $ref: '#/components/schemas/Link' }
            cancelar: { $ref: '#/components/schemas/Link' }
            seguimiento: { $ref: '#/components/schemas/Link' }
    Link:
      type: object
      required: [href]
      properties:
        href: { type: string, format: uri }
        method: { type: string, description: Método HTTP si no es GET. }
    Seguimiento:
      type: object
      properties:
        codigoSeguimiento: { type: string, example: RB-7KQ2M9XHTA }
        estado:
          type: string
          enum: [PENDIENTE, CONFIRMADO, EN_CAMINO, ENTREGADO, CANCELADO, DEVUELTO_AL_COMERCIO]
        fechaPrometida:
          type: string
          format: date
          example: "2026-10-16"
          description: Día prometido (ADR-042). No viene si no se pudo prometer.
        llegadaEstimada:
          type: object
          description: Solo EN_CAMINO con un repartidor de Rabbit (ADR-043). En qué parada de su hoja de ruta va y una franja aproximada. Si no se puede estimar, el campo no viene.
          properties:
            numeroParada: { type: integer, example: 4 }
            totalParadas: { type: integer, example: 9 }
            desde: { type: string, example: "15:00" }
            hasta: { type: string, example: "15:30" }
        ubicacionRepartidor:
          type: object
          description: Solo EN_CAMINO con un repartidor de Rabbit que compartió su ubicación en los últimos 15 minutos. Si no, el campo no viene.
          properties:
            latitud: { type: number, example: -34.6037 }
            longitud: { type: number, example: -58.3816 }
            actualizada: { type: string, description: "Hora local de Rabbit (sin zona), ej. 2026-10-15T14:05:12" }
    Problema:
      type: object
      description: Problem Details (RFC 9457).
      required: [type, title, status]
      properties:
        type: { type: string, description: Identifica el tipo de problema. }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores:
          type: array
          description: Solo en 400 por formato, un error por campo.
          items:
            type: object
            properties:
              campo: { type: string }
              mensaje: { type: string }
