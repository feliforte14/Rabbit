# Levanta Rabbit con docker compose (base local + WildFly + semilla) y deja
# en el entorno del job los IDs que usan las pruebas: ITEM, ITEM_CARGA, PUNTO.
# Las contraseñas se generan en el runner y se descartan al terminar el job.
name: Levantar Rabbit
description: docker compose up con semilla, y espera a que Rabbit responda
runs:
  using: composite
  steps:
    - name: .env de prueba (contraseñas descartables)
      shell: bash
      run: |
        {
          echo "DB_NAME=rabbit"
          echo "DB_USER=rabbit"
          echo "DB_PASSWORD=$(openssl rand -hex 16)"
          echo "ADMIN_USER=admin.ci"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
          echo "DEMO_PASSWORD=$(openssl rand -hex 16)"
          echo "RABBIT_HORA_CORTE=ninguno"
        } > .env
        # Que no aparezcan en los logs aunque algún paso las imprima.
        grep PASSWORD .env | cut -d= -f2 | while read -r v; do echo "::add-mask::$v"; done

    - name: Construir y levantar
      shell: bash
      run: |
        echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"
        docker compose up -d --build

    - name: Esperar a que Rabbit responda
      shell: bash
      run: |
        for _ in $(seq 1 72); do
          codigo=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/Rabbit/ || true)
          if [ "$codigo" = "200" ]; then
            echo "Rabbit respondió 200 en $(( $(date +%s) - INICIO )) s"
            echo "Rabbit levantó en $(( $(date +%s) - INICIO )) s (build incluido)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sleep 5
        done
        echo "Rabbit no respondió en 6 minutos (último código: $codigo)"; exit 1

    - name: La semilla terminó bien
      shell: bash
      run: |
        # "docker compose wait" no ve contenedores que ya terminaron: se lee el estado.
        id=$(docker compose ps -aq semilla)
        for _ in $(seq 1 24); do
          [ "$(docker inspect -f '{{.State.Status}}' "$id")" = "exited" ] && break
          sleep 5
        done
        codigo=$(docker inspect -f '{{.State.ExitCode}}' "$id")
        echo "La semilla terminó con código $codigo"
        [ "$codigo" = 0 ]
        docker compose exec -T db psql -U rabbit -d rabbit -tAc \
          "SELECT count(*) FROM usuarios WHERE username='admin.ci' AND rol='ADMINISTRADOR' AND hash_clave LIKE '\$2%'" | grep -qx 1
        echo "Semilla: administrador y cuentas demo creados con bcrypt" >> "$GITHUB_STEP_SUMMARY"

    - name: Sin errores al desplegar
      shell: bash
      run: |
        docker compose logs wildfly > wildfly.log
        grep -q 'Deployed "Rabbit.war"' wildfly.log
        ! grep -E 'WFLYCTL0013|WFLYSRV0021|Deployment .* failed' wildfly.log

    - name: IDs de la semilla
      shell: bash
      run: |
        q() { docker compose exec -T db psql -U rabbit -d rabbit -tAc "$1"; }
        item() { q "SELECT i.id FROM items_inventario i JOIN comercios c ON c.id=i.idcomercio WHERE c.nombre='Almacén Demo 1' AND i.producto='$1'"; }
        {
          echo "ITEM=$(item 'Yerba mate 1 kg')"
          echo "ITEM_CARGA=$(item 'Producto de carga')"
          echo "PUNTO=$(q "SELECT p.id FROM puntos_picking p JOIN comercios c ON c.id=p.comercio_id WHERE c.nombre='Almacén Demo 1' AND p.nombre='Local Palermo'")"
        } >> "$GITHUB_ENV"
