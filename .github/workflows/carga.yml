# =====================================================================
# Prueba de carga (eje C): k6 con 50 usuarios durante 5 minutos sobre tres
# endpoints, contra el compose (base local). Umbrales en el script:
# p95 < 500 ms, errores < 1%. No corre en cada push porque tarda ~8 min.
# =====================================================================
name: Carga

on:
  push:
    branches: [main]
  # En una PR, solo si cambia la prueba de carga o lo que levanta el compose.
  pull_request:
    paths:
      - scripts/carga/**
      - .github/workflows/carga.yml
      - .github/actions/levantar-rabbit/**
      - docker/**
      - Dockerfile
      - docker-compose.yml
  workflow_dispatch:
    inputs:
      usuarios:
        description: Usuarios virtuales
        default: "50"
      duracion:
        description: Duración de la meseta (k6, por ejemplo 5m)
        default: "5m"

permissions:
  contents: read

concurrency:
  group: carga-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    name: k6
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/levantar-rabbit
      - name: Instalar k6
        run: |
          curl -fsSL https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin k6-v2.3.0-linux-amd64/k6
      - name: k6
        env:
          VUS: ${{ inputs.usuarios || '50' }}
          DURACION: ${{ inputs.duracion || '5m' }}
        run: |
          set -a; . ./.env; set +a
          mkdir -p target/k6
          k6 run -e BASE=https://localhost:8443/Rabbit -e ERP_USUARIO=demo.erp -e ERP_CLAVE="$DEMO_PASSWORD" \
            -e ITEM="$ITEM_CARGA" -e VUS="$VUS" -e DURACION="$DURACION" scripts/carga/k6-rabbit.js
      - name: Resumen
        if: always()
        run: |
          [ -f target/k6/resumen.md ] && cat target/k6/resumen.md >> "$GITHUB_STEP_SUMMARY"
          docker compose down -v || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6
          path: target/k6/
          retention-days: 14
